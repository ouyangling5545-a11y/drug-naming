[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drug-naming"
version = "0.4.0"
description = "创新药命名管理系统 - INN申请、中文核名、商品名一站式管理"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jellyfish>=1.0.0",
    "pypinyin>=0.50.0",
    "eval_type_backport>=0.2.0",
    "rdkit>=2023.9.0",
]
license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/drug_naming"]

[tool.pytest.ini_options]
testpaths = ["src/drug_naming/tests"]
